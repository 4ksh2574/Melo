name: React migration build check

on:
  push:
    branches:
      - react-typescript-migration
  pull_request:
    branches:
      - main
      - react-typescript-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
